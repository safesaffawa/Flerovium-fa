plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "flerovium-fabric-${project.minecraft_version}"
}

repositories {
	// Modrinth Maven (for Sodium and Iris via Modrinth)
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = uri("https://api.modrinth.com/maven")
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Fabric Maven for Fabric API, MixinExtras, and Loom dependencies
	maven {
		name = "Fabric"
		url = uri("https://maven.fabricmc.net/")
	}

	// Mojang Libraries
	maven {
		name = "Mojang"
		url = uri("https://libraries.minecraft.net/")
	}

	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"flerovium" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	accessWidenerPath = file("src/main/resources/flerovium.accesswidener")
}

dependencies {
	// To change the versions see gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	// Fabric Loader
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MixinExtras from Fabric Maven
	implementation "io.github.llamalad7:mixinextras-fabric:${project.mixin_extras_version}"

	// Sodium from Modrinth Maven (project slug: AANobbMI, version ID: 2Yom1N68)
	implementation "maven.modrinth:sodium:2Yom1N68"

	// Iris from Modrinth Maven (project slug: YL57xq9U, version ID: oaD6KQls)
	implementation "maven.modrinth:iris:oaD6KQls"
}

processResources {
	def replaceProperties = [
			version          : project.version,
			minecraft_version: project.minecraft_version,
			loader_version   : project.loader_version
	]
	inputs.properties replaceProperties

	filesMatching(["fabric.mod.json"]) {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {}
}
